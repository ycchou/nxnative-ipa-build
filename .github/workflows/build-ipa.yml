name: Build nxnative IPA (Chinese patch)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Check disk space
        run: df -h /

      - name: Checkout nxnative
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative

      - name: Install Homebrew dependencies
        run: |
          brew install xcodegen zstd spirv-cross glslang
          brew install --cask dotnet-sdk

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          pip install lz4 capstone fonttools "backports.zstd" gdown

      # ── 下載遊戲 XCI ──────────────────────────────────────────
      - name: Download game XCI from Google Drive
        run: |
          mkdir -p game
          python3 -c "
          import gdown
          gdown.download(id='${{ secrets.GAME_FILE_ID }}', output='game/The Great Ace Attorney Chronicles [0100D7F00FB1A000][v0][JP].xci', quiet=False)
          "
          ls -lh game/

      # ── 下載漢化補丁 RAR ────────────────────────────────────────
      - name: Download Chinese patch RAR from Google Drive
        run: |
          python3 -c "
          import gdown
          gdown.download(id='${{ secrets.PATCH_FILE_ID }}', output='patch.rar', quiet=False)
          "
          ls -lh patch.rar

      # ── 寫入 prod.keys ─────────────────────────────────────────
      - name: Write prod.keys
        run: |
          echo '${{ secrets.PROD_KEYS }}' | base64 --decode > prod.keys

      # ── 建構 IPA（日文語言，補丁會替換日文文字檔）────────────────
      - name: Build IPA
        run: |
          python3 scripts/build_ipa_from_nsp.py ./game -k prod.keys -l ja

      # ── 找到 IPA ───────────────────────────────────────────────
      - name: Locate IPA
        id: locate
        run: |
          IPA=$(find ./game -name "*.ipa" | head -1)
          NAME=$(basename "$IPA" .ipa)
          echo "ipa_path=$IPA" >> $GITHUB_OUTPUT
          echo "ipa_name=$NAME" >> $GITHUB_OUTPUT
          echo "ipa_basename=$(basename $IPA)" >> $GITHUB_OUTPUT
          ls -lh "$IPA"

      # ── 解壓補丁並應用到 IPA ───────────────────────────────────
      - name: Apply Chinese patch to IPA
        run: |
          IPA="${{ steps.locate.outputs.ipa_path }}"
          NAME="${{ steps.locate.outputs.ipa_name }}"

          echo "=== Extracting IPA ==="
          mkdir -p ipa_work
          unzip -q "$IPA" -d ipa_work

          echo "=== App bundle structure ==="
          ls ipa_work/Payload/

          APP=$(find ipa_work/Payload -name "*.app" -maxdepth 1 | head -1)
          echo "App bundle: $APP"
          ls "$APP/" | head -20

          echo "=== Extracting Chinese patch RAR ==="
          mkdir -p patch_extracted

          # 用 unar 或 unrar 解 RAR（macOS runner 有 unar）
          if command -v unar &>/dev/null; then
            unar -o patch_extracted patch.rar
          else
            brew install unar
            unar -o patch_extracted patch.rar
          fi

          # 找補丁的 romfs 資料夾
          PATCH_ROMFS=$(find patch_extracted -type d -name "romfs" | head -1)
          echo "Patch romfs: $PATCH_ROMFS"
          ls "$PATCH_ROMFS/"

          echo "=== Applying patch files to IPA ==="
          # 確保目標 romfs 存在
          mkdir -p "$APP/romfs"
          # 覆蓋補丁檔案（保留 IPA 中原有的其他檔案）
          rsync -av "$PATCH_ROMFS/" "$APP/romfs/"

          echo "=== Repacking patched IPA ==="
          cd ipa_work
          zip -r -9 "../${NAME}_zh.ipa" . > /dev/null
          cd ..

          ls -lh "${NAME}_zh.ipa"
          echo "patched_ipa=${NAME}_zh.ipa" >> $GITHUB_ENV

      # ── 建立 GitHub Release ─────────────────────────────────────
      - name: Create GitHub Release
        run: |
          gh release create "build-${{ github.run_number }}" \
            --repo "${{ github.repository }}" \
            --title "IPA Build #${{ github.run_number }} (Chinese patch)" \
            --notes "The Great Ace Attorney Chronicles — 漢化版 IPA build #${{ github.run_number }}" \
            --prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 切割並上傳 IPA 片段 ────────────────────────────────────
      - name: Split and upload patched IPA
        run: |
          NAME="${{ steps.locate.outputs.ipa_name }}"
          PATCHED="${NAME}_zh.ipa"
          REPO="${{ github.repository }}"
          TAG="build-${{ github.run_number }}"

          echo "Splitting $PATCHED into 1.9 GB parts..."
          split -b 1900m "$PATCHED" "${PATCHED}.part-"

          PARTS=(${PATCHED}.part-*)
          echo "Total parts: ${#PARTS[@]}"

          RELEASE_ID=$(gh api repos/$REPO/releases/tags/$TAG --jq '.id')
          echo "Release ID: $RELEASE_ID"

          for part in "${PARTS[@]}"; do
            PART_NAME=$(basename "$part")
            echo "=== Uploading $PART_NAME ($(du -sh $part | cut -f1)) ==="

            # 強制刪除 release 中任何同名 asset（包含 pending 狀態）
            gh api repos/$REPO/releases/$RELEASE_ID/assets \
              --jq ".[] | select(.name==\"$PART_NAME\") | .id" \
              | xargs -I{} gh api -X DELETE repos/$REPO/releases/$RELEASE_ID/assets/{} \
              2>/dev/null || true

            # 上傳，最多重試 3 次
            for retry in 1 2 3; do
              if gh release upload "$TAG" "$part" --repo "$REPO"; then
                echo "Upload succeeded."
                break
              fi
              echo "Upload failed (attempt $retry), retrying in 10s..."
              sleep 10
              # 再次清除可能殘留的 pending asset
              gh api repos/$REPO/releases/$RELEASE_ID/assets \
                --jq ".[] | select(.name==\"$PART_NAME\") | .id" \
                | xargs -I{} gh api -X DELETE repos/$REPO/releases/$RELEASE_ID/assets/{} \
                2>/dev/null || true
            done
          done

          echo ""
          echo "=============================="
          echo "下載全部 part-* 檔案後，執行："
          echo "cat ${PATCHED}.part-* > ${PATCHED}"
          echo "=============================="
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
