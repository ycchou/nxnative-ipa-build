name: Build nxnative IPA (Chinese patch)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Check disk space
        run: df -h /

      - name: Checkout nxnative
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          ref: ed7c473b67dd4d542e9f7a74bc8badea2315b2a4  # shaders OK with Metal 32023.883; patch DmGamepad.m below

      # ── 修補 DmGamepad.m（移除 iOS 27 SDK 才有的 deviceMotionBody）────
      - name: Patch DmGamepad.m (remove iOS 27 deviceMotionBody)
        run: |
          sed -i '' '/deviceMotionBody/d' dm/ios/Sources/DmGamepad.m
          echo "=== Patched DmGamepad.m (line removed if present) ==="
          grep -n "deviceMotion" dm/ios/Sources/DmGamepad.m || true

      - name: Install Homebrew dependencies
        run: |
          brew install xcodegen zstd spirv-cross glslang unar
          brew install --cask dotnet-sdk

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          pip install lz4 capstone fonttools "backports.zstd" gdown

      # ── 下載遊戲 XCI（從 GitHub Release，速度遠快於 Google Drive）──
      - name: Download game XCI from GitHub Release
        run: |
          mkdir -p game
          XCI_NAME="The Great Ace Attorney Chronicles [0100D7F00FB1A000][v0][JP].xci"
          gh release download xci-source \
            --repo "${{ github.repository }}" \
            --pattern "game.xci.part-*" \
            --dir game/
          echo "合併分片..."
          cat game/game.xci.part-aa game/game.xci.part-ab game/game.xci.part-ac > "game/$XCI_NAME"
          rm game/game.xci.part-*
          ls -lh game/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 下載漢化補丁 RAR ────────────────────────────────────────
      - name: Download Chinese patch RAR from Google Drive
        run: |
          python3 -c "
          import gdown
          gdown.download(id='${{ secrets.PATCH_FILE_ID }}', output='patch.rar', quiet=False)
          "
          ls -lh patch.rar

      # ── 寫入 prod.keys ─────────────────────────────────────────
      - name: Write prod.keys
        run: |
          echo '${{ secrets.PROD_KEYS }}' | base64 --decode > prod.keys

      # ── 第一次建構：產生 provisional game.tsv ────────────────────
      - name: Build IPA (first pass — generate provisional profile)
        run: |
          python3 scripts/build_ipa_from_nsp.py ./game -k prod.keys -l ja --allow-other-metal

      # ── 修補 provisional game.tsv（修正黑屏問題）─────────────────
      # JP 版 (0100D7F00FB1A000) 為 provisional profile，romfs_marker 指向
      # 錯誤檔案 (CREDIT.mp4)，且缺少 tex_flush_upload / tex_dirty_upload。
      # 需複製西方版 (010036E00FB20000) 的這 4 個 key。
      # 參考：https://github.com/seedds/nxnative/issues/568
      - name: Patch provisional game.tsv (fix black screen)
        run: |
          GAME_TSV="./game/0100D7F00FB1A000_build/profile/0100D7F00FB1A000/game.tsv"
          if [ ! -f "$GAME_TSV" ]; then
            echo "ERROR: provisional game.tsv not found!"
            find ./game -name "game.tsv" 2>/dev/null || true
            exit 1
          fi
          echo "=== Before patch ==="
          cat "$GAME_TSV"

          # 移除舊的（可能錯誤的）key，再加入正確值
          for key in romfs_marker tex_flush_upload tex_dirty_upload depth_mode; do
            sed -i '' "/^${key}	/d" "$GAME_TSV"
          done
          printf "romfs_marker\tnativeNXx64/sa/NX_64/root.arc\n" >> "$GAME_TSV"
          printf "tex_flush_upload\ton\n"                         >> "$GAME_TSV"
          printf "tex_dirty_upload\ton\n"                         >> "$GAME_TSV"
          printf "depth_mode\tzero\n"                             >> "$GAME_TSV"

          echo "=== After patch ==="
          cat "$GAME_TSV"

      # ── 把漢化補丁注入 RomFS.img（解壓→套用→重打包）────────────────
      # nx_extract 直接從 XCI 建立 RomFS.img，沒有中間的 loose-files 目錄。
      # romfs_locate() 以 RomFS.img 為唯一資料來源，loose romfs/ 目錄完全無效。
      # 正確做法：
      #   1. 用 romfs_image.read_index() 把 RomFS.img 解壓成 RomFS/ 資料夾
      #   2. 用 rsync 把中文補丁覆寫進 RomFS/
      #   3. 用 romfs_image.pack() 從 RomFS/ 重建 RomFS.img（覆寫原檔）
      #   4. 第二次 build 直接使用已含中文的 RomFS.img
      - name: Apply Chinese patch to RomFS.img (extract, patch, repack)
        run: |
          # Step 1: 解壓漢化補丁 RAR
          unar -o patch_extracted patch.rar
          PATCH_ROMFS=$(find patch_extracted -type d -name "romfs" | head -1)
          if [ -z "$PATCH_ROMFS" ]; then
            echo "ERROR: 找不到補丁的 romfs 資料夾"
            find patch_extracted -type d
            exit 1
          fi
          echo "補丁來源: $PATCH_ROMFS ($(find "$PATCH_ROMFS" -type f | wc -l) 個檔案)"

          # Step 2: 找到 RomFS.img（-iname 不分大小寫，避免大小寫陷阱）
          ROMFS_IMG=$(find ./game -iname "romfs.img" | head -1)
          if [ -z "$ROMFS_IMG" ]; then
            echo "ERROR: 找不到 RomFS.img！"
            find ./game -name "*.img" -maxdepth 8 2>/dev/null | head -20 || true
            exit 1
          fi
          echo "=== RomFS.img: $ROMFS_IMG ($(ls -lh "$ROMFS_IMG" | awk '{print $5}')) ==="

          # Step 3: 解壓 RomFS.img → RomFS/ 資料夾
          ROMFS_DIR="$(dirname "$ROMFS_IMG")/RomFS"
          export ROMFS_IMG ROMFS_DIR

          cat > /tmp/extract_romfs.py << 'PYEOF'
          import sys, os
          sys.path.insert(0, 'dm/tools')
          import romfs_image

          img_path = os.environ['ROMFS_IMG']
          out_dir  = os.environ['ROMFS_DIR']
          os.makedirs(out_dir, exist_ok=True)

          index = romfs_image.read_index(img_path)
          dirs  = [(p, m) for p, m in index.items() if m[0]]
          files = [(p, m) for p, m in index.items() if not m[0]]
          print(f'Index: {len(index)} entries ({len(dirs)} dirs, {len(files)} files)')

          with open(img_path, 'rb') as f:
              for guest_path, _ in dirs:
                  os.makedirs(os.path.join(out_dir, guest_path), exist_ok=True)
              count = 0
              for guest_path, (_, offset, size) in files:
                  out_path = os.path.join(out_dir, guest_path)
                  parent   = os.path.dirname(out_path)
                  if parent:
                      os.makedirs(parent, exist_ok=True)
                  f.seek(offset)
                  remaining = size
                  with open(out_path, 'wb') as out_f:
                      while remaining > 0:
                          chunk = f.read(min(remaining, 8 << 20))
                          if not chunk: break
                          out_f.write(chunk)
                          remaining -= len(chunk)
                  count += 1
                  if count % 1000 == 0:
                      print(f'  Extracted {count}/{len(files)}...')
          print(f'解壓完成: {count} 個檔案 → {out_dir}')
          PYEOF

          echo "=== 解壓 RomFS.img → $ROMFS_DIR ==="
          python3 /tmp/extract_romfs.py
          echo "解壓後檔案數: $(find "$ROMFS_DIR" -type f | wc -l)"

          # Step 4: 套用中文補丁（覆寫 RomFS/ 裡對應的日文檔案）
          echo "=== 套用中文補丁 ==="
          rsync -a "$PATCH_ROMFS/" "$ROMFS_DIR/"
          echo "套用後檔案數: $(find "$ROMFS_DIR" -type f | wc -l)"

          # Step 5: 從含中文的 RomFS/ 重打包 RomFS.img（覆寫原檔，自動更新 stamp）
          cat > /tmp/pack_romfs.py << 'PYEOF'
          import sys, os
          sys.path.insert(0, 'dm/tools')
          import romfs_image

          src = os.environ['ROMFS_DIR']
          dst = os.environ['ROMFS_IMG']
          print(f'打包: {src} → {dst}')
          n = romfs_image.pack(src, dst)
          print(f'完成: {n} entries, {os.path.getsize(dst):,} bytes')
          PYEOF

          echo "=== 重打包 RomFS.img ==="
          python3 /tmp/pack_romfs.py
          echo "=== 重建後 RomFS.img: $(ls -lh "$ROMFS_IMG") ==="
          echo "=== RomFS/ 保留（$(find "$ROMFS_DIR" -type f | wc -l) 個檔案，含中文）==="

      # ── 第二次建構：用修補後的 game.tsv + 含中文的 romfs 重建 IPA ──
      - name: Build IPA (second pass — patched game.tsv + Chinese romfs)
        run: |
          python3 scripts/build_ipa_from_nsp.py ./game -k prod.keys -l ja --allow-other-metal

      # ── 找到 IPA ───────────────────────────────────────────────
      - name: Locate IPA
        id: locate
        run: |
          IPA=$(find ./game -name "*.ipa" | head -1)
          NAME=$(basename "$IPA" .ipa)
          echo "ipa_path=$IPA" >> $GITHUB_OUTPUT
          echo "ipa_name=$NAME" >> $GITHUB_OUTPUT
          echo "ipa_basename=$(basename $IPA)" >> $GITHUB_OUTPUT
          ls -lh "$IPA"

      # ── 重命名 IPA（中文已在 romfs.img 內，直接標記 _zh）────────────
      - name: Rename IPA to _zh
        run: |
          IPA="${{ steps.locate.outputs.ipa_path }}"
          NAME="${{ steps.locate.outputs.ipa_name }}"
          cp "$IPA" "${NAME}_zh.ipa"
          ls -lh "${NAME}_zh.ipa"
          echo "patched_ipa=${NAME}_zh.ipa" >> $GITHUB_ENV

      # ── 建立 GitHub Release ─────────────────────────────────────
      - name: Create GitHub Release
        run: |
          gh release create "build-${{ github.run_number }}" \
            --repo "${{ github.repository }}" \
            --title "IPA Build #${{ github.run_number }} (Chinese patch)" \
            --notes "The Great Ace Attorney Chronicles — 漢化版 IPA build #${{ github.run_number }}" \
            --prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 切割並上傳 IPA 片段 ────────────────────────────────────
      - name: Split and upload patched IPA
        run: |
          NAME="${{ steps.locate.outputs.ipa_name }}"
          PATCHED="${NAME}_zh.ipa"
          REPO="${{ github.repository }}"
          TAG="build-${{ github.run_number }}"

          echo "Splitting $PATCHED into 1.9 GB parts..."
          split -b 1900m "$PATCHED" "${PATCHED}.part-"

          PARTS=(${PATCHED}.part-*)
          echo "Total parts: ${#PARTS[@]}"

          RELEASE_ID=$(gh api repos/$REPO/releases/tags/$TAG --jq '.id')
          echo "Release ID: $RELEASE_ID"

          for part in "${PARTS[@]}"; do
            PART_NAME=$(basename "$part")
            echo "=== Uploading $PART_NAME ($(du -sh $part | cut -f1)) ==="

            # 強制刪除 release 中任何同名 asset（包含 pending 狀態）
            gh api repos/$REPO/releases/$RELEASE_ID/assets \
              --jq ".[] | select(.name==\"$PART_NAME\") | .id" \
              | xargs -I{} gh api -X DELETE repos/$REPO/releases/$RELEASE_ID/assets/{} \
              2>/dev/null || true

            # 上傳，最多重試 3 次
            for retry in 1 2 3; do
              if gh release upload "$TAG" "$part" --repo "$REPO"; then
                echo "Upload succeeded."
                break
              fi
              echo "Upload failed (attempt $retry), retrying in 10s..."
              sleep 10
              # 再次清除可能殘留的 pending asset
              gh api repos/$REPO/releases/$RELEASE_ID/assets \
                --jq ".[] | select(.name==\"$PART_NAME\") | .id" \
                | xargs -I{} gh api -X DELETE repos/$REPO/releases/$RELEASE_ID/assets/{} \
                2>/dev/null || true
            done
          done

          echo ""
          echo "=============================="
          echo "下載全部 part-* 檔案後，執行："
          echo "cat ${PATCHED}.part-* > ${PATCHED}"
          echo "=============================="
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
